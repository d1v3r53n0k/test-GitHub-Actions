name: CI PR Check

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc

    - name: Build Project
      run: |
        # Замените эти команды на ваши (например, make или cmake)
        gcc -o my_program main.c

