name: Create Release on Merge

on:
  push:
    branches: [ "main" ]

jobs:
  release:
    # Запуск только если push произошел из-за успешного слияния Pull Request
    if: github.event.commits[0] != null && contains(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install GCC
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc

    - name: Build Binary
      run: |
        # Сборка финального бинарника
        gcc -o my_program main.c

    - name: Generate Release Tag
      id: tag
      run: |
        # Автоматический тег на основе даты и времени (например, v2026.10.20-1738)
        TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Release ${{ steps.tag.outputs.tag_name }}
        body: |
          Автоматический релиз успешно создана после слияния Pull Request.
        draft: false
        prerelease: false
        # Путь к файлам, которые нужно прикрепить к релизу
        files: |
          my_program

