name: Create Release on Merge

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Настраиваем конфигурационную матрицу для 4-х платформ
        include:
          - target: linux-x64
            compiler: gcc
            flags: "-m64"
            output_name: my_program_linux_x64
          - target: linux-x86
            compiler: gcc
            flags: "-m32"
            output_name: my_program_linux_x86
          - target: windows-x64
            compiler: x86_64-w64-mingw32-gcc
            flags: ""
            output_name: my_program_windows_x64.exe
          - target: windows-x86
            compiler: i686-w64-mingw32-gcc
            flags: ""
            output_name: my_program_windows_x86.exe

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Compilers and Dependencies
      run: |
        sudo apt-get update
        # gcc-multilib нужен для сборки 32-битного Linux на 64-битной Ubuntu
        # mingw-w64 нужен для кросс-компиляции под Windows
        sudo apt-get install -y build-essential gcc-multilib mingw-w64

    - name: Build Binary
      run: |
        ${{ matrix.compiler }} ${{ matrix.flags }} -o ${{ matrix.output_name }} main.c

    # Загружаем собранный файл во временное хранилище GitHub Artifacts
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: binary-${{ matrix.target }}
        path: ${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build # Ждем, пока завершатся все сборки из матрицы выше
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Скачиваем абсолютно все файлы, собранные на этапе 'build'
    - name: Download All Artifacts
      uses: actions/download-artifact@v4
      with:
        merge-multiple: true

    - name: Generate Release Tag
      id: tag
      run: |
        TAG_NAME="v$(date +'%Y.%m.%d-%H%M')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Release ${{ steps.tag.outputs.tag_name }}
        body: |
          Автоматический релиз со сборками под Windows и Linux (x86 / x64).
        draft: false
        prerelease: false
        # Сюда попадут все скомпилированные файлы, которые мы скачали на предыдущем шаге
        files: |
          my_program_linux_x64
          my_program_linux_x86
          my_program_windows_x64.exe
          my_program_windows_x86.exe